name: Checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python scripts/verify.py
      - name: Windows Credential Manager roundtrip
        if: runner.os == 'Windows'
        env:
          RUN_NATIVE_KEYRING_TESTS: '1'
        run: python scripts/verify.py tests/test_credentials.py::test_native_os_keyring_roundtrip
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
